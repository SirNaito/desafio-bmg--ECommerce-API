name: .NET CI

on:
  push:
    branches:
      - main
      - "portfolio/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BigEcommerce.sln

      - name: Test
        run: dotnet test BigEcommerce.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish Ecommerce.Api/Ecommerce.Api.csproj --configuration Release --no-restore
