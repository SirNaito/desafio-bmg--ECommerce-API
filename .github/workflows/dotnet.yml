name: .NET CI

on:
  push:
    branches:
      - main
      - "portfolio/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BigEcommerce.sln
      - run: dotnet test BigEcommerce.sln --configuration Release --no-restore
